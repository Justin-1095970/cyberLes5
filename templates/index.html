<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>encryption webapp</title>
    <link rel="stylesheet" href="{{ url_for('static' , filename='css/style.css') }}">
</head>
<body>
   <h1>VERY SECURE TEXT ENCRYPTION!!!!!!!!!!</h1>

    <form id="createKeyForm">
        <input type="text" id="keyName" placeholder="name" required>
        <input type="password" id="password" placeholder="password" required>
        <input type="password" id="masterPassword" placeholder="masterPassword" required>
        <button type="submit">create Key</button>
    </form>

    <form id="encryptForm">
        <textarea id="plaintext" placeholder="tekst om te versleuten" required></textarea>
        <input type="text" id="encryptedKeyName" placeholder="key name" required>
        <input type="password" id="encryptedMasterPassword" placeholder="maser password" required>
        <button type="submit">encrypt</button>
    </form>

    <div id="encryptedResult" style="display:none">
        <h3>encrypt tekst: </h3>
        <textarea id="encryptedText" readonly></textarea>
    </div>

   <form id="decryptForm">
        <textarea id="decipherText" placeholder="decrypted tekst" required></textarea>
        <input type="text" id="decryptedKeyName" placeholder="key name" required>
        <input type="password" id="decryptedMasterPassword" placeholder="maser password" required>
        <button type="submit">decrypt</button>
    </form>

    <div id="decryptedResult" style="display:none">
        <h3>decrypt tekst: </h3>
        <textarea id="decryptedText" readonly></textarea>
    </div>

   <form id="shareKeyForm">
       <input type="text" id="shareKeyName" placeholder="key name" required>
       <input type="password" id="shareMasterPassword" placeholder="master password" required>
       <input type="password" id="recipientPassword" placeholder="receip password" required>
       <button type="submit">share package</button>
   </form>

   <div id="shareResult" style="display:none">
       <h3>share package: </h3>
       <textarea id="sharePackage" readonly></textarea>
       <button onclick="copyPackage()">copy</button>
   </div>

   <form id="importKeyForm">
       <textarea id="importPackage" placeholder="import key" required></textarea>
       <input type="password" id="importRPassword" placeholder="receip password" required>
       <input type="text" id="importKeyName" placeholder="key name" required>
       <input type="password" id="importMasterPassword" placeholder="maser password" required>
       <button type="submit">import key</button>
   </form>

    <div id="message"></div>

    <script>
        document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/create-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    key_name: document.getElementById('keyName').value,
                    password: document.getElementById('password').value,
                    master_password: document.getElementById('masterPassword').value
                })
            })
            const data = await response.json()
            document.getElementById('message').textContent = data.message || data.error
        })

        document.getElementById('encryptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/encrypt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: document.getElementById('plaintext').value,
                    key_name: document.getElementById('encryptedKeyName').value,
                    master_password: document.getElementById('encryptedMasterPassword').value
                })
            })
            const data = await response.json()
            if (data.success) {
                document.getElementById('encryptedText').value = data.result
                document.getElementById('encryptedResult').style.display = 'block'
            }
            document.getElementById('message').textContent = data.message || data.error
        })

        document.getElementById('decryptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/decrypt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: document.getElementById('ciphertext').value,
                    decryptedKeyName: document.getElementById('decKeyName').value,
                    decryptedMasterPassword: document.getElementById('decMasterPassword').value
                })
            })
            const data = await response.json()
            if (data.success) {
                document.getElementById('decryptedText').value = data.result
                document.getElementById('decryptedResult').style.display = 'block'
            }
            document.getElementById('message').textContent = data.message || data.error
        })

        document.getElementById('shareKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/share-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    keyName: document.getElementById('shareKeyName').value,
                    password: document.getElementById('password').value,
                    recipient_password: document.getElementById('recipientPassword').value
                })
            })
            const data = await response.json()
            if (data.success) {
                document.getElementById('sharePackage').value = data.result
                document.getElementById('shareResult').style.display = 'block'
            }
            document.getElementById('message').textContent = data.message || data.error
        })

        document.getElementById('importKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/receive-key', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    package: document.getElementById('importPackage').value,
                    R_Password: document.getElementById('importRPassword').value,
                    new_key_name: document.getElementById('importNewKeyName').value,
                    master_password: document.getElementById('importMasterPassword').value,
                })
            })
            const data = await response.json()
            document.getElementById('message').textContent = data.message || data.error
        })

        function copyPackage() {
            const text = document.getElementById('sharePackage').value
            navigator.clipboard.writeText(text)
        }

    </script>

</body>
</html>
